.btn{border:none;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer;font-family:inherit;margin:3px 2px}
.btn-p{background:var(--teal);color:#fff}
.btn-g{background:#eef3f4;color:var(--ink)}
.btn-d{background:#fdecea;color:var(--danger)}
.btn-sm{padding:6px 10px;font-size:12px}

.row select{flex:0 1 116px}
.row input.share-custom{flex:0 1 96px}
.idx{width:20px;text-align:center;color:var(--teal-d);font-weight:bold;font-size:13px}

.imgs{display:flex;gap:8px;flex-wrap:wrap}

<div class="wrap" data-page-node-id="kZMQRT3V8d1JbcW9ngSQMg">

    <p data-page-node-id="dSOy5BcDVL0HhBNPYon1Pr">请填写公司信息并上传身份证件。</p>
  </header>

  <div class="card" data-page-node-id="iaJfi9utHdQP7Rptk8Gw6O">
    <h2 data-page-node-id="pNQ6fV99P3hCGCnq2M00Jf">一、公司注册信息</h2>

    <label data-page-node-id="PYscn43xJOsbO8DcGiupZm">公司中文名称 <span style="color:var(--danger)" data-page-node-id="SrZyAJRGHQ5n8PRpixaQT5">*</span></label>
    <input type="text" id="cnName" placeholder="请输入公司中文名称" data-page-node-id="VeguN2DWeq8zCK9UABTMPx">
    <div id="nameRisk" data-page-node-id="ChXipithnulF371gCqdzP4"></div>

    <label data-page-node-id="mdQmXdJ5cd4sqnBJBCnADw">公司英文名称</label>
    <input type="text" id="enName" placeholder="请输入公司英文名称" data-page-node-id="q9b526YQvdDHeaRWBGYdjj">
    <p class="muted" data-page-node-id="EkFub4KGspdMdtGjCbXobU">可只填中文、只填英文，或两者都填。</p>

    <label>经营范围 <span style="color:var(--danger)">*</span></label>

    <div id="scopeRisk"></div>

    <label>注册资本（认缴）</label>

    <h2 style="margin-top:18px">职位担任与股份比例</h2>

    <p class="muted" data-page-node-id="c2BF96Trin0rDInoTZ550E">点击「保存并生成压缩包」后，页面会生成一个资料压缩包文件，请保存后发送至对接人员。</p>

'廉政公署','海關','稅務局','入境處','警務處','阿里','騰訊','華為','Apple','Tesla','不雅','色情','暴力','歧視','侮辱','賭博','洗錢','走私','詐騙','恐怖組織',

];

/* ===== 经营范围风险词（源：不能用的经营范围及分行） ===== */
const SCOPE_RISK=[
'基金會','理事會','總會','銀行','BANK','评议会','council','科學院','學院','書院','株式會社','司法鑒定','HOSPITAL','博物館','機構','認證','公益','慈善','CHARITY','商品交易中心','行业联合会','研究院','书院','总社','委员会',
'基金管理','資產管理','投資管理','虛擬資產','保險','基金','奶瓶','醫院管理','採礦煉油','礦業','石礦','市政','工控','募集捐款','法物流通','財富管理','清關','高等教育','受託發行私慕基金','工商註冊服務','能源管理','實體經濟','房地產服務','財務服務','託管','上市投行','能源','贸易经济','基金托管','金融業務','服務咨詢','商務代理待辦','財務','金融','公益慈善活動','慈善服務','慈善咨詢','金融服務','會展服務','相關活動','企業管理',
'基金会','银行','科学院','博物馆','机构','认证','研究院','委员会','资产管理','投资管理','虚拟资产','保险','医院管理','矿业','财富管理','高等教育','能源管理','房地产','财务','托管','金融','企业管理'
];

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}

/* ===== 职位 / 人员 / 股份 ===== */
let people=[],certs=[];
const SHARES=['100%','90%','80%','70%','60%','50%','40%','30%','20%','10%'];
function uid(){return Math.random().toString(36).slice(2,9)}
function renderPeople(){
  const box=document.getElementById('people');
  if(!people.length)people.push({id:uid(),position:'董事',name:'',share:'100%'});
  box.innerHTML=people.map((p,i)=>{
    const custom=SHARES.indexOf(p.share)<0;
    return '<div class="row"><span class="idx">'+(i+1)+'</span>'+
      '<select data-k="position" data-i="'+i+'">'+
        '<option value="董事"'+(p.position==='董事'?' selected':'')+'>董事</option>'+
        '<option value="股东"'+(p.position==='股东'?' selected':'')+'>股东</option>'+
      '</select>'+
      '<input type="text" placeholder="担任人员" value="'+esc(p.name)+'" data-k="name" data-i="'+i+'">'+
      '<select data-k="share" data-i="'+i+'">'+
        SHARES.map(o=>'<option value="'+o+'"'+(o===p.share?' selected':'')+'>'+o+'</option>').join('')+
        '<option value="__custom"'+(custom?' selected':'')+'>手动输入</option>'+
      '</select>'+
      '<input type="text" class="share-custom" placeholder="如 15%" value="'+(custom?esc(p.share):'')+'" data-i="'+i+'" style="'+(custom?'':'display:none')+'">'+
      (people.length>1?'<button class="rm" data-i="'+i+'">删除</button>':'')+'</div>';
  }).join('');
  box.querySelectorAll('select[data-k="position"]').forEach(s=>s.onchange=()=>{people[+s.dataset.i].position=s.value});
  box.querySelectorAll('select[data-k="share"]').forEach(s=>s.onchange=()=>{
    const i=+s.dataset.i,p=people[i],ci=box.querySelector('.share-custom[data-i="'+i+'"]');
    if(s.value==='__custom'){ci.style.display='';ci.focus()}
    else{ci.style.display='none';ci.value='';p.share=s.value}
  });
  box.querySelectorAll('.share-custom').forEach(inp=>inp.oninput=()=>{people[+inp.dataset.i].share=inp.value});
  box.querySelectorAll('input[data-k="name"]').forEach(inp=>{
    inp.oninput=()=>{people[+inp.dataset.i].name=inp.value};
    inp.onblur=()=>{const p=people[+inp.dataset.i];if(p.name){p.name=toTrad(p.name);renderPeople()}};
  });
  box.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{people.splice(+b.dataset.i,1);renderPeople()});
}
document.getElementById('addPerson').onclick=()=>{people.push({id:uid(),position:'董事',name:'',share:'100%'});renderPeople()};

/* ===== 身份证件 ===== */
const SLOTS=[{k:'front',label:'身份证正面'},{k:'back',label:'身份证反面'},{k:'hold',label:'手持身份证照片'}];
function renderCerts(){
  const box=document.getElementById('certs');
  if(!certs.length)certs.push({id:uid(),name:'',front:null,back:null,hold:null});
  box.innerHTML=certs.map((p,i)=>
    '<div class="crow"><div class="cname"><span class="idx">'+(i+1)+'</span>'+
    '<input type="text" placeholder="人员姓名" value="'+esc(p.name)+'" data-i="'+i+'">'+
    (certs.length>1?'<button class="rm" data-i="'+i+'">删除</button>':'')+'</div>'+
    '<div class="imgs">'+SLOTS.map(s=>{
      const f=p[s.k];
      return '<label class="slot"><span>'+s.label+'</span>'+
        (f?'<img src="'+f.thumb+'" alt="'+s.label+'">':'<div class="ph">点击上传</div>')+
        '<input type="file" accept="image/*" data-i="'+i+'" data-s="'+s.k+'" style="display:none"></label>';
    }).join('')+'</div></div>'
  ).join('');
  box.querySelectorAll('.cname input').forEach(inp=>{
    inp.oninput=()=>{certs[+inp.dataset.i].name=inp.value};
    inp.onblur=()=>{const p=certs[+inp.dataset.i];if(p.name){p.name=toTrad(p.name);renderCerts()}};
  });
  box.querySelectorAll('input[type=file]').forEach(inp=>inp.onchange=()=>pickImg(inp));
  box.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{certs.splice(+b.dataset.i,1);renderCerts()});
}
function pickImg(inp){
  const i=+inp.dataset.i,k=inp.dataset.s,f=inp.files&&inp.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const b64=r.result.split(',')[1];
    certs[i][k]={name:f.name,type:f.type,size:f.size,data:b64,thumb:r.result};
    renderCerts();
  };
  r.readAsDataURL(f);
}
document.getElementById('addCert').onclick=()=>{certs.push({id:uid(),name:'',front:null,back:null,hold:null});renderCerts()};

/* ===== 风险提示 ===== */
function checkNameRisk(){
  const v=document.getElementById('cnName').value;
  const hit=NAME_RISK.filter(w=>w&&v.includes(w));
  document.getElementById('nameRisk').innerHTML=hit.length
    ?'<div class="warnbox">⚠ 高风险名称提醒：名称含「'+esc(hit.join('、'))+'」，该名称可能导致审核不通过，二次递交需额外付费 500 元，请谨慎考虑。</div>':'';
}
function checkScopeRisk(){
  const v=document.getElementById('scope').value.toLowerCase();
  const hit=SCOPE_RISK.filter(w=>w&&v.includes(w.toLowerCase()));
  document.getElementById('scopeRisk').innerHTML=hit.length
    ?'<div class="warnbox">⚠ 经营范围风险提醒：内容含「'+esc(hit.join('、'))+'」，该经营范围可能无法通过审核，建议调整后再提交。</div>':'';
}
document.getElementById('cnName').oninput=checkNameRisk;
document.getElementById('cnName').onblur=function(){this.value=toTrad(this.value);checkNameRisk()};
document.getElementById('enName').onblur=function(){this.value=toTrad(this.value)};
document.getElementById('scope').oninput=function(){
  const n=[...this.value].length,c=document.getElementById('scopeCount');
  c.textContent=n+' / 30';c.className='counter'+(n>30?' over':'');
  checkScopeRisk();
};
document.getElementById('scope').onblur=function(){this.value=toTrad(this.value);this.oninput()};

/* ===== 一键清除 ===== */
document.getElementById('clearBtn').onclick=()=>{
  if(!confirm('确定清除全部已填信息吗？'))return;
  people=[];certs=[];
  ['cnName','enName','scope'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('capital').value='10000';
  document.getElementById('scopeCount').textContent='0 / 30';
  document.getElementById('scopeCount').className='counter';
  checkNameRisk();checkScopeRisk();renderPeople();renderCerts();
};

/* ===== 生成压缩包 ===== */
document.getElementById('saveBtn').onclick=async()=>{
  const btn=document.getElementById('saveBtn');
  const cnName=document.getElementById('cnName').value.trim();
  const enName=document.getElementById('enName').value.trim();
  const scope=document.getElementById('scope').value.trim();
  const capital=document.getElementById('capital').value.trim()||'10000';
  if(!cnName&&!enName){alert('公司中文名称或英文名称至少填写一项');return}
  const n=[...scope].length;
  if(n>30){alert('经营范围超过30字（当前'+n+'字），请修改后再保存');return}
  if(!scope){alert('请填写经营范围');return}
  btn.classList.add('busy');btn.textContent='正在生成...';
  try{
    const pick=f=>f?{name:f.name,type:f.type,data:f.data}:null;
    const data={
      title:'香港公司注册资料',savedAt:new Date().toISOString(),
      company:{
        cnName:cnName?toTrad(cnName):'',enName:enName?toTrad(enName):'',scope:toTrad(scope),capital:capital,
        people:people.map(p=>({position:p.position,name:toTrad(p.name),share:p.share}))
      },
      certs:certs.map(p=>({name:toTrad(p.name),front:pick(p.front),back:pick(p.back),hold:pick(p.hold)}))
    };
    const base=((cnName||enName||'香港公司')+'公司注册资料').replace(/[\\/:*?"<>|]/g,'_');
    /* 关键：buildDocx 返回 Blob，必须转为 Uint8Array 再交给 zipPack，否则压缩包内 Word 为 0 字节 */
    const docxBlob=buildDocx(data);
    const docxBytes=new Uint8Array(await docxBlob.arrayBuffer());
    const entries=[{name:base+'/公司注册信息.docx',data:docxBytes}];
    const safe=x=>String(x||'人员').replace(/[\\/:*?"<>|]/g,'_');
    for(const p of data.certs){
      for(const s of SLOTS){
        const f=p[s.k];if(!f||!f.data)continue;
        const ext=(f.name&&f.name.split('.').pop())||'jpg';
        entries.push({name:base+'/身份证件/'+safe(p.name)+'/'+s.label+'.'+ext,data:base64ToU8(f.data)});
      }
    }
    downloadBlob(zipPack(entries),base+'.zip');
  }catch(e){alert('生成失败：'+e.message)}
  finally{btn.classList.remove('busy');btn.textContent='保存并生成压缩包'}
};
function base64ToU8(b64){const s=atob(b64),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}

/* ===== 完整 DOCX ===== */
function buildDocx(d){
  const c=d.company||{};
  const x=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
  const para=(t,b)=>'<w:p><w:r><w:rPr>'+(b?'<w:b/><w:sz w:val="26"/>':'<w:sz w:val="22"/>')+'<w:rFonts w:ascii="Calibri" w:eastAsia="SimSun"/></w:rPr><w:t xml:space="preserve">'+x(t)+'</w:t></w:r></w:p>';
  let body='';
  body+=para('香港公司注册资料',true)+para('');
  body+=para('一、公司注册信息',true);
  body+=para('公司中文名称：'+(c.cnName||''));
  body+=para('公司英文名称：'+(c.enName||''));
  body+=para('经营范围：'+(c.scope||''));
  body+=para('注册资本（认缴）：'+(c.capital||'10000')+' HKD');
  body+=para('');
  body+=para('二、职位担任与股份比例',true);
  const ppl=c.people||[];
  if(!ppl.length)body+=para('（未填写）');
  ppl.forEach((p,i)=>body+=para((i+1)+'. 职位：'+(p.position||'')+'，担任人员：'+(p.name||'')+'，股份比例：'+(p.share||'')));
  body+='<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/></w:sectPr>';
  const doc='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+'</w:body></w:document>';
  const ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/></Types>';
  const rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/></Relationships>';
  const drels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
  const styles='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>';
  const core='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>香港公司注册资料</dc:title><dc:creator>TenLink</dc:creator></cp:coreProperties>';
  const app='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>TenLink</Application></Properties>';
  const enc=new TextEncoder();
  return zipPack([
    {name:'[Content_Types].xml',data:enc.encode(ct)},
    {name:'_rels/.rels',data:enc.encode(rels)},
    {name:'word/document.xml',data:enc.encode(doc)},
    {name:'word/_rels/document.xml.rels',data:enc.encode(drels)},
    {name:'word/styles.xml',data:enc.encode(styles)},
    {name:'docProps/core.xml',data:enc.encode(core)},
    {name:'docProps/app.xml',data:enc.encode(app)}
  ]);
}

/* ===== 极简 ZIP ===== */
const CRCT=(function(){const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0}return t})();
function crc32(u){let c=0xffffffff;for(let i=0;i<u.length;i++)c=CRCT[(c^u[i])&255]^(c>>>8);return(c^0xffffffff)>>>0}
function zipPack(entries){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  entries.forEach(e=>{
    const nb=enc.encode(e.name),crc=crc32(e.data),sz=e.data.length;
    const lh=new Uint8Array(30+nb.length),v=new DataView(lh.buffer);
    v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x0800,true);
    v.setUint16(8,0,true);v.setUint16(10,0,true);v.setUint16(12,0,true);
    v.setUint32(14,crc,true);v.setUint32(18,sz,true);v.setUint32(22,sz,true);
    v.setUint16(26,nb.length,true);v.setUint16(28,0,true);lh.set(nb,30);
    parts.push(lh,e.data);
    const ch=new Uint8Array(46+nb.length),cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true);cv.setUint16(10,0,true);cv.setUint16(12,0,true);cv.setUint16(14,0,true);
    cv.setUint32(16,crc,true);cv.setUint32(20,sz,true);cv.setUint32(24,sz,true);
    cv.setUint16(28,nb.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);
    cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint32(38,0,true);cv.setUint32(42,off,true);
    ch.set(nb,46);central.push(ch);off+=lh.length+sz;
  });
  let cs=0;central.forEach(c=>cs+=c.length);
  const eo=new Uint8Array(22),ev=new DataView(eo.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);
  ev.setUint16(8,entries.length,true);ev.setUint16(10,entries.length,true);
  ev.setUint32(12,cs,true);ev.setUint32(16,off,true);ev.setUint16(20,0,true);
  return new Blob(parts.concat(central,[eo]),{type:'application/zip'});
}

/* ===== 初始化 ===== */
renderPeople();
renderCerts();
checkNameRisk();
checkScopeRisk();
</script>
